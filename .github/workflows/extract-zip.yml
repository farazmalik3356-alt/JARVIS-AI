
name: Move JARVIS-AI Files to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move project files
        run: |
          set -e

          if [ ! -d "JARVIS-AI" ]; then
            echo "ERROR: JARVIS-AI folder not found"
            exit 1
          fi

          find JARVIS-AI -mindepth 1 -maxdepth 1 -exec mv -t . -- {} +

          rmdir JARVIS-AI

          echo "Project files moved to repository root."

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Move JARVIS-AI project files to root"
            git push
          else
            echo "No changes to commit."
          fi
